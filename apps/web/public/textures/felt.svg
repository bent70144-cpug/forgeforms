<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <!-- Coral · felt desk tile: the same stitched layers at coarser grain, warmer and deeper -->
  <filter id="felt" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="4" result="cloud"/>
    <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 0.38  0 0 0 0 0.33  0 0 0 0 0.27  0 0 0 0.07 0" result="cloudTint"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="19" result="weave"/>
    <feColorMatrix in="weave" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.26  0 0 0 0 0.21  0 0 0 0.055 0" result="weaveTint"/>
    <feMerge>
      <feMergeNode in="cloudTint"/>
      <feMergeNode in="weaveTint"/>
    </feMerge>
  </filter>
  <rect width="360" height="360" fill="#e9e2d6"/>
  <rect width="360" height="360" filter="url(#felt)"/>
</svg>
