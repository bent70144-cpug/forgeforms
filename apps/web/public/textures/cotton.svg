<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <!-- Coral · cotton stock tile: two stitched turbulence layers, warm and faint, with short fibre strokes -->
  <filter id="cotton" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7" result="cloud"/>
    <feColorMatrix in="cloud" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.38  0 0 0 0 0.33  0 0 0 0.05 0" result="cloudTint"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="11" result="grain"/>
    <feColorMatrix in="grain" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.31  0 0 0 0 0.26  0 0 0 0.045 0" result="grainTint"/>
    <feMerge>
      <feMergeNode in="cloudTint"/>
      <feMergeNode in="grainTint"/>
    </feMerge>
  </filter>
  <rect width="360" height="360" fill="#f8f5ef"/>
  <rect width="360" height="360" filter="url(#cotton)" opacity="0.7"/>
  <g fill="none" stroke="#8a8378" stroke-width="0.6" opacity="0.05" stroke-linecap="round">
